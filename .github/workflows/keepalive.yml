name: keepalive
on:
  schedule:
    - cron: "0 6 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS "${{ secrets.KEEPALIVE_URL || vars.KEEPALIVE_URL }}/api/keepalive" || curl -fsS "https://skvfranemokfosegejnn.supabase.co/rest/v1/users?select=id&limit=1" -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" || true
